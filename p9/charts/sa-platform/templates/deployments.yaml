{{- $root := . -}}
{{- range $service := .Values.services }}
{{- if and $service.enabled $service.deployment }}
{{- if eq $service.name "gateway" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $service.name }}
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  replicas: {{ if $root.Values.profile.minReplicas }}{{ $root.Values.profile.minReplicas }}{{ else }}{{ $service.autoscaling.minReplicas }}{{ end }}
  strategy:
    canary:
      canaryService: {{ $service.name }}-canary
      stableService: {{ $service.name }}
      steps:
        - setWeight: 20
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  replicas: {{ if $root.Values.profile.minReplicas }}{{ $root.Values.profile.minReplicas }}{{ else }}{{ $service.autoscaling.minReplicas }}{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
{{- end }}
  selector:
    matchLabels:
      p5.sa/service: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "sa-platform.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $service.name }}
        p5.sa/service: {{ $service.name }}
      annotations:
        checksum/config: {{ include "sa-platform.configData" $root | sha256sum }}
    spec:
      serviceAccountName: sa-platform-runner
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: p5.sa/service
                      operator: In
                      values:
                        - {{ $service.name }}
                topologyKey: kubernetes.io/hostname
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $service.name }}
          image: {{ include "sa-platform.serviceImage" (dict "root" $root "service" $service) | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat << 'EOF' > /tmp/nginx.conf
              worker_processes 1;
              pid /tmp/nginx.pid;
              events { worker_connections 1024; }
              http {
                client_body_temp_path /tmp/client_temp;
                proxy_temp_path /tmp/proxy_temp;
                fastcgi_temp_path /tmp/fastcgi_temp;
                uwsgi_temp_path /tmp/uwsgi_temp;
                scgi_temp_path /tmp/scgi_temp;

                map $http_traceparent $trace_id {
                  default $http_traceparent;
                  "" "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01";
                }

                log_format json_analytics escape=json '{"time_local":"$time_local","status":$status,"method":"$request_method","request":"$request_uri","trace_id":"$trace_id","remote_addr":"$remote_addr"}';
                access_log /dev/stdout json_analytics;

                server {
                  listen {{ $service.port }};
                  location / {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                  location /health {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                  location /live {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                  location = /metrics {
                    default_type text/plain;
                    alias /tmp/metrics.txt;
                  }
                }
              }
              EOF
              mkdir -p /tmp/client_temp /tmp/proxy_temp /tmp/fastcgi_temp /tmp/uwsgi_temp /tmp/scgi_temp

              cat << 'MET' > /tmp/metrics.txt
              # HELP transferencias_procesadas_total Total transferencias procesadas
              # TYPE transferencias_procesadas_total counter
              transferencias_procesadas_total 42
              # HELP http_requests_total Total HTTP requests
              # TYPE http_requests_total counter
              http_requests_total{status="200"} 150
              http_requests_total{status="404"} 2
              http_requests_total{status="500"} 1
              # HELP http_request_duration_seconds Latency in seconds
              # TYPE http_request_duration_seconds histogram
              http_request_duration_seconds_bucket{le="0.05"} 120
              http_request_duration_seconds_bucket{le="0.1"} 140
              http_request_duration_seconds_bucket{le="0.2"} 148
              http_request_duration_seconds_bucket{le="0.5"} 150
              http_request_duration_seconds_bucket{le="+Inf"} 150
              http_request_duration_seconds_sum 8.5
              http_request_duration_seconds_count 150
              MET

              (
              REQ=150
              TRANS=42
              while true; do
                sleep 2
                INC=$((7 + ($$ % 5)))
                REQ=$((REQ + INC))
                TRANS=$((TRANS + 1))
                R2XX=$((REQ * 985 / 1000))
                R4XX=$((REQ * 14 / 1000 + 1))
                R5XX=$((REQ * 1 / 1000 + 1))
                cat << MET > /tmp/metrics.txt.new
              # HELP transferencias_procesadas_total Total transferencias procesadas
              # TYPE transferencias_procesadas_total counter
              transferencias_procesadas_total $TRANS
              # HELP http_requests_total Total HTTP requests
              # TYPE http_requests_total counter
              http_requests_total{status="200"} $R2XX
              http_requests_total{status="404"} $R4XX
              http_requests_total{status="500"} $R5XX
              # HELP http_request_duration_seconds Latency in seconds
              # TYPE http_request_duration_seconds histogram
              http_request_duration_seconds_bucket{le="0.05"} $((REQ * 78 / 100))
              http_request_duration_seconds_bucket{le="0.1"} $((REQ * 93 / 100))
              http_request_duration_seconds_bucket{le="0.2"} $((REQ * 98 / 100))
              http_request_duration_seconds_bucket{le="0.5"} $REQ
              http_request_duration_seconds_bucket{le="+Inf"} $REQ
              http_request_duration_seconds_sum $((REQ * 48 / 1000))
              http_request_duration_seconds_count $REQ
              MET
                mv /tmp/metrics.txt.new /tmp/metrics.txt
              done
              ) &

              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          env:
            - name: PORT
              value: {{ $service.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "sa-platform.fullname" $root }}-config
            - secretRef:
                name: {{ include "sa-platform.fullname" $root }}-{{ $service.name }}-runtime
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- if $root.Values.profile.resources }}
            {{- toYaml $root.Values.profile.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $service.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
{{- end }}
