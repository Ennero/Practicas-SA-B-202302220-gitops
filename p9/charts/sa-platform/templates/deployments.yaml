{{- $root := . -}}
{{- range $service := .Values.services }}
{{- if and $service.enabled $service.deployment }}
{{- if eq $service.name "gateway" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $service.name }}
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  replicas: {{ if $root.Values.profile.minReplicas }}{{ $root.Values.profile.minReplicas }}{{ else }}{{ $service.autoscaling.minReplicas }}{{ end }}
  strategy:
    canary:
      canaryService: {{ $service.name }}-canary
      stableService: {{ $service.name }}
      steps:
        - setWeight: 20
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
        - setWeight: 50
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
        - setWeight: 100
        - analysis:
            templates:
              - templateName: {{ $service.name }}-smoke-analysis
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  replicas: {{ if $root.Values.profile.minReplicas }}{{ $root.Values.profile.minReplicas }}{{ else }}{{ $service.autoscaling.minReplicas }}{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
{{- end }}
  selector:
    matchLabels:
      p5.sa/service: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "sa-platform.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $service.name }}
        p5.sa/service: {{ $service.name }}
      annotations:
        checksum/config: {{ include "sa-platform.configData" $root | sha256sum }}
    spec:
      serviceAccountName: sa-platform-runner
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: p5.sa/service
                      operator: In
                      values:
                        - {{ $service.name }}
                topologyKey: kubernetes.io/hostname
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $service.name }}
          image: {{ include "sa-platform.serviceImage" (dict "root" $root "service" $service) | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat << 'EOF' > /tmp/nginx.conf
              worker_processes 1;
              pid /tmp/nginx.pid;
              events { worker_connections 1024; }
              http {
                client_body_temp_path /tmp/client_temp;
                proxy_temp_path /tmp/proxy_temp;
                fastcgi_temp_path /tmp/fastcgi_temp;
                uwsgi_temp_path /tmp/uwsgi_temp;
                scgi_temp_path /tmp/scgi_temp;
                server {
                  listen {{ $service.port }};
                  location / {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                  location /health {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                  location /live {
                    return 200 'OK';
                    add_header Content-Type text/plain;
                  }
                }
              }
              EOF
              mkdir -p /tmp/client_temp /tmp/proxy_temp /tmp/fastcgi_temp /tmp/uwsgi_temp /tmp/scgi_temp
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          env:
            - name: PORT
              value: {{ $service.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "sa-platform.fullname" $root }}-config
            - secretRef:
                name: {{ include "sa-platform.fullname" $root }}-{{ $service.name }}-runtime
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- if $root.Values.profile.resources }}
            {{- toYaml $root.Values.profile.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $service.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
{{- end }}
