{{- $root := . -}}
{{- range $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" $root }}-{{ $service.name }}-runtime
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    p5.sa/service: {{ $service.name }}
type: Opaque
stringData:
  {{- if $service.database }}
  {{- $database := index $root.Values $service.database }}
  {{- if or (eq $service.name "auth") (eq $service.name "notificaciones") }}
  DATABASE_URL: {{ printf "mysql://%s:%s@%s:3306/%s" $database.auth.username $database.auth.password $service.database $database.auth.database | quote }}
  {{- else }}
  DATABASE_DSN: {{ printf "%s:%s@tcp(%s:3306)/%s?parseTime=true&charset=utf8mb4" $database.auth.username $database.auth.password $service.database $database.auth.database | quote }}
  {{- end }}
  {{- end }}
  {{- if or (eq $service.name "transacciones") (eq $service.name "notificaciones") (eq $service.name "operaciones") }}
  NATS_URL: "nats://nats:4222"
  NATS_TOKEN: {{ default "${NATS_TOKEN}" (and $root.Values.secrets $root.Values.secrets.natsToken) | quote }}
  {{- end }}
  {{- if eq $service.name "gateway" }}
  JWT_SECRET: {{ default "${JWT_SECRET}" (and $root.Values.secrets $root.Values.secrets.jwtSecret) | quote }}
  {{- end }}
  {{- if eq $service.name "auth" }}
  JWT_SECRET: {{ default "${JWT_SECRET}" (and $root.Values.secrets $root.Values.secrets.jwtSecret) | quote }}
  AES_KEY: {{ default "${AES_KEY}" (and $root.Values.secrets $root.Values.secrets.aesKey) | quote }}
  HMAC_PEPPER: {{ default "${HMAC_PEPPER}" (and $root.Values.secrets $root.Values.secrets.hmacPepper) | quote }}
  {{- end }}
{{- end }}
---
{{- end }}
