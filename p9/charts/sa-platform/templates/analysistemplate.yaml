{{- $root := . -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-smoke-analysis
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: gateway-smoke-analysis
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 10s
      count: 2
      successCondition: len(result) > 0 && result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.observabilidad.svc.cluster.local:9090
          query: |
            (sum(rate(http_requests_total{status!~"5..",rollouts_pod_template_hash='{{ `{{args.canary-hash}}` }}'}[1m])) or vector(1))
            /
            (sum(rate(http_requests_total{rollouts_pod_template_hash='{{ `{{args.canary-hash}}` }}'}[1m])) or vector(1))
    - name: latency-p95
      interval: 10s
      count: 2
      successCondition: len(result) > 0 && result[0] <= 1.0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.observabilidad.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{rollouts_pod_template_hash='{{ `{{args.canary-hash}}` }}'}[1m])) by (le)) or vector(0.05)
