apiVersion: v2
name: sa-platform
description: Plataforma bancaria P5 desplegable localmente con Helm.
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: mariadb
    alias: auth-db
    version: 1.0.0
    repository: file://../mariadb
    condition: auth-db.enabled
  - name: mariadb
    alias: cuentas-db
    version: 1.0.0
    repository: file://../mariadb
    condition: cuentas-db.enabled
  - name: mariadb
    alias: beneficiarios-db
    version: 1.0.0
    repository: file://../mariadb
    condition: beneficiarios-db.enabled
  - name: mariadb
    alias: transacciones-db
    version: 1.0.0
    repository: file://../mariadb
    condition: transacciones-db.enabled
  - name: mariadb
    alias: notificaciones-db
    version: 1.0.0
    repository: file://../mariadb
    condition: notificaciones-db.enabled
  - name: mariadb
    alias: operaciones-db
    version: 1.0.0
    repository: file://../mariadb
    condition: operaciones-db.enabled
  - name: nats
    version: 1.2.6
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
