imagePullPolicy: IfNotPresent
profile:
  name: prod
  imageRepository: mirror.gcr.io/library/nginx
  imageTag: "1.25-alpine"
  logLevel: warn
  minReplicas: 3
  maxReplicas: 6
  targetCPU: 70
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
autoscaling:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
