imagePullPolicy: IfNotPresent
profile:
  name: dev
  imageTag: "1.0.0-dev"
  logLevel: debug
  minReplicas: 2
  maxReplicas: 3
  targetCPU: 80
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 250m, memory: 256Mi }
autoscaling:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
