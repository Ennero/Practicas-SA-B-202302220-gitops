{{- if .Values.applications.sealedSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.applications.sealedSecrets.name }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-platform-root
    course: sa-b-2026
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.applications.sealedSecrets.chart.repoURL }}
    chart: {{ .Values.applications.sealedSecrets.chart.chart }}
    targetRevision: {{ .Values.applications.sealedSecrets.chart.targetRevision }}
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: {{ .Values.applications.sealedSecrets.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
