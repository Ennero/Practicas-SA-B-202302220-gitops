imagePullPolicy: IfNotPresent
profile:
  name: staging
  imageTag: "1.0.0"
  logLevel: info
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
autoscaling:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
