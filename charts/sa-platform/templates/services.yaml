{{- $root := . -}}
{{- $gatewayType := default "NodePort" .Values.exposure.gateway.type -}}
{{- range $service := .Values.services }}
{{- if and $service.enabled $service.deployment }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
spec:
  type: {{ if eq $service.name "gateway" }}{{ $gatewayType }}{{ else }}ClusterIP{{ end }}
  selector:
    p5.sa/service: {{ $service.name }}
  ports:
    - name: http
      port: {{ if and (eq $service.name "gateway") (eq $gatewayType "LoadBalancer") $root.Values.exposure.gateway.port }}{{ $root.Values.exposure.gateway.port }}{{ else }}{{ $service.port }}{{ end }}
      targetPort: http
      protocol: TCP
      {{- if and (eq $service.name "gateway") (eq $gatewayType "NodePort") }}
      nodePort: {{ $service.nodePort }}
      {{- end }}
---
{{- if eq $service.name "gateway" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}-canary
  namespace: {{ include "sa-platform.namespace" $root }}
  labels:
    {{- include "sa-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}-canary
spec:
  type: ClusterIP
  selector:
    p5.sa/service: {{ $service.name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
{{- end }}
{{- end }}
